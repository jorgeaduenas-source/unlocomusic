<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ünloco</title>

<style>

body{
    margin:0;
    background:#08131d;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.logo-wrap{
    position:relative;
    width:95%;
    max-width:1100px;
}

.logo{
    width:100%;
    display:block;
}

/* Facebook icon click area */
.facebook-hotspot{
    position:absolute;
    left:41.5%;
    bottom:12%;
    width:10%;
    height:10%;
    border-radius:50%;
}

/* Instagram icon click area */
.instagram-hotspot{
    position:absolute;
    left:50.5%;
    bottom:12%;
    width:10%;
    height:10%;
    border-radius:50%;
}

</style>

</head>

<body>

<div class="logo-wrap">

    <img src="unloco-logo.png" class="logo" alt="Ünloco">

    <a
        class="facebook-hotspot"
        href="https://www.facebook.com/unlocotx"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Facebook">
    </a>

    <a
        class="instagram-hotspot"
        href="https://www.instagram.com/unlocotx"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram">
    </a>

</div>

</body>
</html>
