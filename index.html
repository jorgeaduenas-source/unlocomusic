<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ünloco</title>

<style>

html,
body{
    margin:0;
    padding:0;
    background:#08131d;
    overflow-x:hidden;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.hero-wrap{
    position:relative;
    width:95vw;
    max-width:1200px;
}

.hero{
    width:100%;
    display:block;
}

/* Instagram hotspot */

.instagram-hotspot{
    position:absolute;
    left:51.5%;
    bottom:11%;
    width:10%;
    height:6%;
    z-index:100;

    background:red;
    opacity:.5;
}

</style>

</head>

<body>

<div class="hero-wrap">

    <!-- Entire image opens Facebook -->

    <a
        href="https://www.facebook.com/unlocotx"
        target="_blank"
        rel="noopener noreferrer">

        <img
            src="unloco-web-hero.png"
            class="hero"
            alt="Ünloco">

    </a>

    <!-- Instagram hotspot -->

    <a
        class="instagram-hotspot"
        href="https://www.instagram.com/unlocotx"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram">
    </a>

</div>

</body>
</html>
