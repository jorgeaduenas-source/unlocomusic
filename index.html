<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ünloco</title>

<style>

body{
    margin:0;
    background:#08131d;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.logo-wrap{
    position:relative;
    width:95%;
    max-width:1100px;
}

.logo{
    width:100%;
    display:block;
}

/* Invisible Facebook click area */
.facebook-hotspot{
    position:absolute;
    left:43%;
    bottom:13%;
    width:9%;
    height:9%;
    border-radius:50%;
}

/* Invisible Instagram click area */
.instagram-hotspot{
    position:absolute;
    left:51%;
    bottom:13%;
    width:9%;
    height:9%;
    border-radius:50%;
}

</style>

</head>

<body>

<div class="logo-wrap">

    <img src="unloco-logo.png" class="logo" alt="Ünloco">

    <a
        class="facebook-hotspot"
        href="https://www.facebook.com/unlocotx"
        target="_blank">
    </a>

    <a
        class="instagram-hotspot"
        href="https://www.instagram.com/unlocotx"
        target="_blank">
    </a>

</div>

</body>
</html>
