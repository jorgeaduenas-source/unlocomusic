<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ünloco</title>

<style>

html,
body{
    margin:0;
    padding:0;
    background:#08131d;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.hero-wrap{
    position:relative;
    width:min(100vw,1920px);
}

.hero{
    width:100%;
    display:block;
}

/* Instagram hotspot */

.instagram-hotspot{
    position:absolute;
    left:51%;
    bottom:6.5%;
    width:5%;
    height:9%;
    z-index:10;

    background:red;
    opacity:.5;
}

/* Mobile */

@media (max-aspect-ratio:4/5){

    body{
        align-items:flex-start;
    .instagram-hotspot{
    left:54%;
    bottom:11%;
    width:10%;
    height:6%;
}
        bottom:10%;
        width:12%;
        height:7%;
    }
}

</style>

</head>

<body>

<div class="hero-wrap">

    <!-- Entire image goes to Facebook -->

    <a
        href="https://www.facebook.com/unlocotx"
        target="_blank"
        rel="noopener noreferrer">

        <img
            src="unloco-web-hero.png"
            class="hero"
            alt="Ünloco">

    </a>

    <!-- Instagram icon only -->

    <a
        class="instagram-hotspot"
        href="https://www.instagram.com/unlocotx"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram">
    </a>

</div>

</body>
</html>
