<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ünloco</title>

<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    overflow:hidden;
}

body{
    background:#000;
}

.page{
    position:relative;
    width:100vw;
    height:100vh;
    height:100svh;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.hero{
    width:100vw;
    height:100vh;
    height:100svh;
    object-fit:contain;
    display:block;
    background:#000;
}

.socials{
    position:absolute;
    left:50%;
    bottom:7.8%;
    transform:translateX(-50%);
    display:flex;
    gap:18px;
    z-index:10;
    opacity:0;
    transition:opacity .25s ease;
}

.page:hover .socials,
.page:active .socials{
    opacity:1;
}

.socials a{
    width:54px;
    height:54px;
    border-radius:50%;
    border:1px solid #00b7d8;
    background:rgba(0,0,0,.72);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    text-decoration:none;
    box-shadow:0 0 14px rgba(0,183,216,.45);
    transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
}

.socials a:hover{
    transform:scale(1.08);
    background:rgba(0,183,216,.18);
    box-shadow:0 0 22px rgba(0,183,216,.85);
}

.socials svg{
    width:24px;
    height:24px;
    fill:currentColor;
}

@media (max-aspect-ratio:4/5){
    .hero{
        content:url("unloco-mobile-hero.png");
    }

    .socials{
        opacity:1;
        bottom:7.6%;
        gap:10px;
    }

    .socials a{
        width:44px;
        height:44px;
    }

    .socials svg{
        width:20px;
        height:20px;
    }
}
</style>
</head>
