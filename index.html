<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ünloco</title>

<style>
body{
    background:#08131d;
    color:white;
    text-align:center;
    font-family:Arial,sans-serif;
    margin:0;
}

.logo{
    max-width:1100px;
    width:96%;
    margin-top:10px;
}

.buttons{
    margin-top:40px;
}

a{
    display:inline-block;
    padding:15px 30px;
    margin:10px;
    color:white;
    border:1px solid white;
    text-decoration:none;
}

a:hover{
    background:white;
    color:black;
}
</style>
</head>

<body>

<div class="logo-wrap">
  <img src="unloco-logo.png" class="logo">

  <a class="hotspot facebook-hotspot" 
     href="https://facebook.com/YOURPAGE" 
     target="_blank" 
     aria-label="Facebook"></a>

  <a class="hotspot instagram-hotspot" 
     href="https://instagram.com/YOURPAGE" 
     target="_blank" 
     aria-label="Instagram"></a>
</div>

<div class="buttons">

<a href="https://facebook.com">
Facebook</a>

<a href="https://instagram.com">
Instagram</a>

</div>

</body>
</html>
