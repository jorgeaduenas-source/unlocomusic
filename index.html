<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ünloco</title>

<style>

body{
    margin:0;
    background:#08131d;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.logo-wrap{
    position:relative;
    width:95%;
    max-width:1100px;
}

/* Entire image links to Facebook */
.main-link{
    display:block;
}

.logo{
    width:100%;
    display:block;
}

/* Instagram icon hotspot */
.instagram-hotspot{
    position:absolute;
    left:51%;
    bottom:13%;
    width:9%;
    height:9%;
    border-radius:50%;
    z-index:10;
}

</style>

</head>

<body>

<div class="logo-wrap">

    <a
        class="main-link"
        href="https://www.facebook.com/unlocotx"
        target="_blank"
        rel="noopener noreferrer">

        <img
            src="unloco-logo.png"
            class="logo"
            alt="Ünloco">

    </a>

    <a
        class="instagram-hotspot"
        href="https://www.instagram.com/unlocotx"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram">
    </a>

</div>

</body>
</html>
