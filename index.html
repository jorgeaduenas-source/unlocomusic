<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ünloco</title>

<style>

html, body{
    margin:0;
    min-height:100%;
    background:#08131d;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.hero-wrap{
    position:relative;
    width:min(100vw, 1920px);
}

.hero{
    width:100%;
    display:block;
}

/* Facebook icon click area */
.facebook-hotspot{
    position:absolute;
    left:43.6%;
    bottom:6.6%;
    width:5.1%;
    height:9.0%;
    border-radius:50%;
}

/* Instagram icon click area */
.instagram-hotspot{
    position:absolute;
    left:51.2%;
    bottom:6.6%;
    width:5.1%;
    height:9.0%;
    border-radius:50%;
}

@media (max-aspect-ratio: 4/5){

    body{
        align-items:flex-start;
    }

    .hero{
        content:url("unloco-mobile-hero.png");
    }

    .facebook-hotspot{
        left:39.0%;
        bottom:20.7%;
        width:9.5%;
        height:6.5%;
    }

    .instagram-hotspot{
        left:51.5%;
        bottom:20.7%;
        width:9.5%;
        height:6.5%;
    }
}

</style>

</head>

<body>

<div class="hero-wrap">

    <img src="unloco-web-hero.png" class="hero" alt="Ünloco">

    <a
        class="facebook-hotspot"
        href="https://www.facebook.com/unlocotx"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Facebook">
    </a>

    <a
        class="instagram-hotspot"
        href="https://www.instagram.com/unlocotx"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram">
    </a>

</div>

</body>
</html>
