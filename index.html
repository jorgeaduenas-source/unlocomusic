<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ünloco</title>

<style>

html, body{
    margin:0;
    padding:0;
    background:#08131d;
    overflow-x:hidden;
}

body{
    display:flex;
    justify-content:center;
}

.hero-wrap{
    position:relative;
    width:100%;
    max-width:1920px;
}

.hero{
    width:100%;
    display:block;
}

/* HUGE Instagram hotspot */
.instagram-hotspot{
    position:absolute;
    left:46%;
    bottom:17%;
    width:18%;
    height:14%;
    z-index:999;
}

@media (max-aspect-ratio: 4/5){

    .hero{
        content:url("unloco-mobile-hero.png");
        width:100%;
    }

    .instagram-hotspot{
        left:43%;
        bottom:18%;
        width:22%;
        height:14%;
    }
}

</style>

</head>

<body>

<div class="hero-wrap">

    <!-- Entire image goes to Facebook -->
    <a
        href="https://www.facebook.com/unlocotx"
        target="_blank"
        rel="noopener noreferrer">

        <img
            src="unloco-web-hero.png"
            class="hero"
            alt="Ünloco">

    </a>

    <!-- Instagram hotspot -->
    <a
        class="instagram-hotspot"
        href="https://www.instagram.com/unlocotx"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram">
    </a>

</div>

</body>
</html>
