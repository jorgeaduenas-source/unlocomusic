<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ünloco</title>

<style>

html, body{
    margin:0;
    padding:0;
    background:#08131d;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.hero-wrap{
    position:relative;
    width:100%;
    max-width:1920px;
}

.hero{
    width:100%;
    display:block;
}

/* Instagram icon hotspot */
.instagram-hotspot{
    position:absolute;
    left:51.2%;
    bottom:6.6%;
    width:5.1%;
    height:9%;
    border-radius:50%;
    z-index:10;
}

@media (max-aspect-ratio: 4/5){

    body{
        align-items:flex-start;
    }

    .hero{
        content:url("unloco-mobile-hero.png");
        width:100%;
    }

    .instagram-hotspot{
        left:51.5%;
        bottom:20.7%;
        width:9.5%;
        height:6.5%;
    }
}

</style>

</head>

<body>

<div class="hero-wrap">

    <!-- Entire image goes to Facebook -->
    <a
        href="https://www.facebook.com/unlocotx"
        target="_blank"
        rel="noopener noreferrer">

        <img
            src="unloco-web-hero.png"
            class="hero"
            alt="Ünloco">

    </a>

    <!-- Instagram icon only -->
    <a
        class="instagram-hotspot"
        href="https://www.instagram.com/unlocotx"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram">
    </a>

</div>

</body>

</html>
