<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ünloco</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    background: #08131d;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.hero-wrap {
    position: relative;
    width: 100%;
    max-width: 1920px;
}
/* Instagram click area */
.instagram-hotspot {
    position: absolute;
    left: 51.8%;
    bottom: 5.2%;
    width: 8%;
    height: 8%;
    z-index: 100;
    background: red;
    opacity: 0.5;
}
    position: absolute;
    left: 50.5%;
    bottom: 6%;
    width: 7%;
    height: 11%;
    z-index: 100;
}

/* Mobile layout */
@media (max-aspect-ratio: 4/5) {

    body {
        align-items: flex-start;
    }

    .hero {
        content: url("unloco-mobile-hero.png");
    }

    .instagram-hotspot {
        left: 51%;
        bottom: 20.5%;
        width: 10%;
        height: 8%;
    }
}

</style>

</head>

<body>

<div class="hero-wrap">

    <!-- EVERYTHING goes to Facebook -->
    <a
        href="https://www.facebook.com/unlocotx"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Facebook">

        <img
            src="unloco-web-hero.png"
            class="hero"
            alt="Ünloco">

    </a>

    <!-- Instagram icon only -->
    <a
        class="instagram-hotspot"
        href="https://www.instagram.com/unlocotx"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram">
    </a>

</div>

</body>
</html>
